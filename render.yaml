services:
  - type: web
    name: redflag-ai-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./scamshield.db
      - key: ALLOWED_ORIGINS
        value: https://redflag-ai.onrender.com
      - key: MAX_UPLOAD_SIZE
        value: "26214400"

  - type: web
    name: redflag-ai
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://redflag-ai-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html